# Publishes the SLRB / DLRB Design Generator (bridge-design/) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy design generator to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['bridge-design/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check design results against the reference sheets
        run: |
          node bridge-design/tests/verify-design.js
          node bridge-design/tests/verify-estimate.js
          node bridge-design/tests/scenarios.js
          node bridge-design/tests/verify-ut.js
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r bridge-design/index.html bridge-design/css bridge-design/js bridge-design/vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
