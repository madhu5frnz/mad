<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLRB / DLRB Design Generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M2 14h28v4H2z%22 fill=%22%231d4ed8%22/%3E%3Cpath d=%22M6 18v10M26 18v10%22 stroke=%22%231d4ed8%22 stroke-width=%223%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="28" height="28"><path d="M2 14h28v4H2z" fill="currentColor"/><path d="M6 18v10M26 18v10" stroke="currentColor" stroke-width="3"/><path d="M9 28c2-6 12-6 14 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </div>
    <div>
      <h1>SLRB / DLRB Design Generator</h1>
      <p class="sub">Road bridge across canal &middot; from Hydraulic Particulars to design, drawings &amp; estimate</p>
    </div>
  </div>
  <div class="type-switch" role="radiogroup" aria-label="Bridge type">
    <button type="button" data-type="SLRB" class="active" role="radio">S.L.R.B.<small>Single lane 4.25 m</small></button>
    <button type="button" data-type="DLRB" role="radio">D.L.R.B.<small>Two lane 7.50 m</small></button>
  </div>
</header>

<div class="layout">
  <aside class="inputs" id="inputs">
    <div class="input-actions">
      <button type="button" id="btn-auto" class="primary">Auto design</button>
      <select id="sel-example" aria-label="Load example">
        <option value="">Load example…</option>
        <option value="km0450">SLRB Km 0.450 (reference)</option>
        <option value="km1580">SLRB Km 1.580 (reference)</option>
        <option value="dlrb">DLRB (same canal, 7.5 m)</option>
      </select>
    </div>
    <div class="input-actions small">
      <button type="button" id="btn-save">Save inputs</button>
      <label class="filebtn">Open inputs<input type="file" id="file-open" accept=".json,application/json"></label>
      <button type="button" id="btn-reset">Reset</button>
    </div>
    <form id="form" autocomplete="off"></form>
  </aside>

  <main class="output">
    <div class="status" id="status"></div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="report" class="active">Design report</button>
      <button type="button" role="tab" data-tab="drawings">Drawings</button>
      <button type="button" role="tab" data-tab="estimate">Estimate</button>
    </nav>

    <section class="tab" id="tab-report">
      <div class="toolbar">
        <button type="button" id="btn-pdf-report">Download PDF</button>
        <button type="button" id="btn-xlsx-design">Download Excel</button>
      </div>
      <div id="report" class="report"></div>
    </section>

    <section class="tab" id="tab-drawings" hidden>
      <div class="toolbar">
        <button type="button" id="btn-pdf-dwg">Download PDF (2 × A2)</button>
        <button type="button" id="btn-dxf">Download DXF for AutoCAD (zip)</button>
      </div>
      <p class="hint">Sheet 1: plan &amp; sectional elevation. Sheet 2: sections &amp; reinforcement details. Use + / − to zoom.</p>
      <div id="drawings"></div>
    </section>

    <section class="tab" id="tab-estimate" hidden>
      <div class="toolbar">
        <button type="button" id="btn-pdf-est">Download PDF</button>
        <button type="button" id="btn-xlsx-est">Download Excel (with formulas)</button>
        <button type="button" id="btn-rates-reset">Reset rates to SSR 2026-27</button>
      </div>
      <div id="estimate" class="report"></div>
    </section>
  </main>
</div>

<script src="vendor/exceljs.min.js" defer></script>
<script src="vendor/jspdf.umd.min.js" defer></script>
<script src="vendor/jspdf.plugin.autotable.min.js" defer></script>
<script src="vendor/jszip.min.js" defer></script>
<script src="js/design.js"></script>
<script src="js/estimate.js"></script>
<script src="js/cad.js"></script>
<script src="js/sheets.js"></script>
<script src="js/export-xlsx.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
